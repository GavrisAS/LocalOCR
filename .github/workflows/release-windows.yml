name: Windows candidate release
on:
  push:
    branches: [main]
permissions:
  contents: write
# No concurrency cancellation: each push must reserve a version.
jobs:
  reserve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - run: uv python install 3.14
      - id: version
        run: uv run --no-project --python 3.14 python scripts/next_version.py --sha '${{ github.sha }}' --before '${{ github.event.before }}' --major 0
  checks:
    needs: reserve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - run: uv python install 3.14
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked
      - run: uv run python scripts/version_smoke.py --version '${{ needs.reserve.outputs.version }}'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: test-results.xml
  build:
    needs: [reserve, checks]
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - run: uv python install 3.14
      - shell: pwsh
        run: ./scripts/build_windows.ps1 -BuildVersion '${{ needs.reserve.outputs.version }}'
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/LocalOCR-v*-windows-x64.zip dist/release/
          Copy-Item dist/*.sha256 dist/release/
          Copy-Item docs/RELEASE_NOTES.md dist/release-notes.md
      - name: Real Windows F16 qualification and Portable packaging
        if: github.run_attempt == 1 && vars.LOCALOCR_QUALIFY_F16 == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            uv run python scripts/prepare_embedded.py --output dist/LocalOCR/embedded --precision f16
            if ($LASTEXITCODE -ne 0) { throw 'Pinned F16 installation failed' }
            ./scripts/qualify_windows.ps1 -Root dist/LocalOCR -Output dist/f16-qualification.json -Sha '${{ github.sha }}'
            uv run python scripts/package_portable.py --root dist/LocalOCR --output dist/portable-assets --tag '${{ needs.reserve.outputs.tag }}' --sha '${{ github.sha }}' --evidence dist/f16-qualification.json
            if ($LASTEXITCODE -ne 0) { throw 'Portable qualification gate failed' }
            ./dist/portable-assets/assemble_portable.ps1 -Destination dist/assembled-validation
            ./scripts/qualify_windows.ps1 -Root dist/assembled-validation/LocalOCR -Output dist/assembled-qualification.json -Sha '${{ github.sha }}'
            Remove-Item dist/assembled-validation -Recurse -Force
            Copy-Item dist/portable-assets/* dist/release/
            Add-Content dist/release-notes.md "`nPortable F16: Windows CPU synthetic 3/30 rows PASS; GPU-capable candidate, GPU_HARDWARE_PENDING (Windows); assembled split assets included."
          } catch {
            Write-Warning $_
            if (-not (Test-Path dist/f16-qualification.json)) {
              @{ status = 'PENDING'; platform = 'win32'; error = "$($_.Exception.Message)" } | ConvertTo-Json | Set-Content dist/f16-qualification.json
            }
            Add-Content dist/release-notes.md "`nPortable F16: PENDING/FAILED qualification; no Portable assets published. Lite remains available. See workflow qualification evidence."
          }
          exit 0
      - name: Exact release manifest
        shell: pwsh
        run: |
          uv run python scripts/release_manifest.py --folder dist/release --tag '${{ needs.reserve.outputs.tag }}' --sha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Asset manifest failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-distribution-attempt-${{ github.run_attempt }}
          path: |
            dist/evaluation-gates.json
            dist/release/*windows-x64.zip
            dist/release/*.sha256
            dist/release/*manifest.json
            dist/release/assemble_portable.ps1
            dist/f16-qualification.json
            dist/assembled-qualification.json
            dist/LocalOCR/embedded/manifest.json
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ needs.reserve.outputs.tag }}'
          $verifyArgs = @('--tag', $tag, '--sha', '${{ github.sha }}')
          if ([int]'${{ github.run_attempt }}' -gt 1) { $verifyArgs += '--require-existing' }
          uv run python scripts/verify_release.py @verifyArgs
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 3) { throw 'Existing release verification failed; immutable assets unchanged' }
          gh release create $tag dist/release/* --verify-tag --prerelease --title "LocalOCR $tag candidate" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
          uv run python scripts/verify_release.py --tag $tag --sha '${{ github.sha }}' --require-existing
          if ($LASTEXITCODE -ne 0) { throw 'Published release verification failed' }
  verify-published-portable:
    needs: [reserve, build]
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.0'
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: Verify downloaded immutable Lite including mandatory frozen gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          uv run python scripts/verify_release.py --tag '${{ needs.reserve.outputs.tag }}' --sha '${{ github.sha }}' --require-existing
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded Lite verification failed' }
      - name: Download immutable published parts and qualify in a separate path
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ needs.reserve.outputs.tag }}'
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect published release' }
          if ($assets -notcontains 'portable-manifest.json') {
            @{ status = 'PENDING'; reason = 'No published Portable asset'; tag = $tag } | ConvertTo-Json | Set-Content published-qualification.json
            exit 0
          }
          gh release download $tag --dir published-parts --pattern '*portable-f16.zip.part*' --pattern portable-manifest.json --pattern assemble_portable.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Published parts download failed' }
          ./published-parts/assemble_portable.ps1 -Destination published-assembled
          Remove-Item published-parts/*.part* -Force
          ./scripts/qualify_windows.ps1 -Root published-assembled/LocalOCR -Output published-qualification.json -Sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-portable-evidence-attempt-${{ github.run_attempt }}
          path: |
            dist/published-lite-gates.json
            published-qualification.json
            published-parts/portable-manifest.json
